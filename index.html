async function studentLogin(){
  const e=$('#se');
  const w=$('#sw').value.trim(),p=$('#sp').value;
  if(!norm(w)||!p)return e.textContent='الرجاء إدخال رقم الواتساب وكلمة المرور';
  e.textContent='جارٍ الدخول…';
  try{
    const j=await authReq('/token?grant_type=password',{email:p2e(w),password:p});
    if(!j.access_token)throw new Error('تعذّر الدخول');
    saveSession({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});
    await sLoad()
  }catch(err){e.textContent='رقم الواتساب أو كلمة المرور غير صحيحة'}}
async function studentSignup(){
  const e=$('#se');
  const w=$('#sw').value.trim(),p=$('#sp').value;
  if(!norm(w))return e.textContent='الرجاء إدخال رقم الواتساب';
  if(!p||p.length<6)return e.textContent='كلمة المرور 6 أحرف على الأقل';
  e.textContent='جارٍ إنشاء الحساب…';
  try{
    const r=await fetch(SB_URL+'/functions/v1/create-student-account',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({phone:w,password:p})});

    if(!r.ok){
      if(j.error==='no_match'){e.textContent='رقم الواتساب غير مسجّل لدى الأكاديمية بعد. تواصلي معنا عبر واتساب لتسجيل بياناتك أولًا.';return}
      if(j.error==='already_registered'){e.textContent='هذا الرقم مسجّل بالفعل — استخدمي تسجيل الدخول';return}
